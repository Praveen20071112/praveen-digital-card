
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Praveen | Digital Card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #101827, #163c4a);
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 30px 22px;
      text-align: center;
      background: #182536;
      border: 1px solid #3d5967;
      border-radius: 24px;
      box-shadow: 0 18px 50px #0005;
    }
    .logo {
      width: 82px;
      height: 82px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #24c6a5;
      color: #102027;
      font-size: 30px;
      font-weight: bold;
    }
    h1 { margin-bottom: 6px; }
    .subtitle { color: #a9c0ce; margin-bottom: 25px; }
    a {
      display: block;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      color: #102027;
      background: #24c6a5;
    }
    a.secondary { background: #e5eef5; }
    .note { color: #a9c0ce; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">KP</div>
    <h1>Kemaruban Praveen</h1>
    <p class="subtitle">My Digital Visiting Card</p>

    <a href="tel:+94770841987">📞 Call Me</a>
    <a class="secondary" href="https://wa.me/94770841987">💬 WhatsApp</a>
    <a class="secondary" href="https://wa.me/94770841987?text=Hi%20Praveen">👋 Say Hello</a>

    <p class="note">Tap a button to connect with me.</p>
  </main>
</body>
</html>
