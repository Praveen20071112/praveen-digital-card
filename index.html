<style>
:root { color-scheme: dark; --red:#ef3038; --bg:#09090b; --panel:#151518; --muted:#b9b9c0; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:radial-gradient(circle at 50% 0%,#391014 0,#151013 30%,var(--bg) 70%); color:#fff; }
.card { width:min(100%,430px); overflow:hidden; border:1px solid #5e2025; border-radius:26px; background:linear-gradient(155deg,#1b1b20,#0e0e11 65%); box-shadow:0 24px 80px #0009; }
.top { height:8px; background:linear-gradient(90deg,#8f1018,var(--red),#ff777b); }
.inner { padding:28px; }
.profile { width:116px; height:116px; object-fit:cover; object-position:center 30%; border-radius:50%; border:3px solid var(--red); box-shadow:0 0 0 6px #ef30381a; display:block; margin:0 auto 18px; }
.kicker { text-align:center; color:#ff6268; letter-spacing:.22em; font-size:11px; font-weight:800; }
h1 { text-align:center; font-size:29px; line-height:1.15; margin:10px 0 7px; }
.subtitle { text-align:center; color:var(--muted); margin:0 0 24px; font-size:14px; }
.links { display:grid; gap:10px; }
a.btn { display:flex; align-items:center; justify-content:center; text-align:center; min-height:48px; padding:12px 14px; border-radius:13px; border:1px solid #36363c; color:#fff; text-decoration:none; font-weight:650; background:#202025; }
a.primary { background:var(--red); border-color:var(--red); color:white; }
a.btn:hover { filter:brightness(1.12); }
.note { color:#9999a2; text-align:center; font-size:11px; margin:20px 0 0; }
</style>
</head>
